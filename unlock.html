<!doctype html>
<html lang="ko">
<head>
<!--HEAD-->
<title>코드 넣기 · 보호자사주</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--TOP-->
<main class="wrap page narrow">
  <div class="page-head">
    <div class="kicker mono"><span>코드</span><span>04–09장 열기</span></div>
    <h1>코드 넣는 곳</h1>
    <p>그로블에서 결제하고 받은 코드 넣으면 돼요. 한 번 넣으면 이 브라우저에선 계속 열려 있어요.</p>
  </div>
  <img class="px" src="./px/door.gif" width="224" height="160" alt="문 앞에서 기다리는 강아지 픽셀 그림" style="width:224px;margin:0 0 8px">
  <div class="paid-box" data-paid hidden>
    <p class="mono">결제했어요 · 그로블에서 결제할 때 쓴 이메일이나 휴대폰 번호</p>
    <form class="ul-form" data-paid-form novalidate>
      <input name="id" inputmode="email" autocomplete="email" spellcheck="false" placeholder="이메일 또는 010-0000-0000" aria-label="결제할 때 쓴 이메일이나 휴대폰 번호">
      <button class="btn" type="submit">확인하고 열기</button>
    </form>
    <p class="mono" style="margin-top:20px">코드를 받았다면</p>
  </div>
  <form class="ul-form" data-code-form novalidate>
    <input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-0000" aria-label="해제코드">
    <button class="btn" type="submit">열기</button>
  </form>
  <p class="ul-msg mono" role="status"></p>
  <div class="info" style="margin-top:28px">
    <div class="row"><span>코드가 없어요</span><span data-nocode><a class="wl" data-buy href="#">그로블에서 구매</a>하면 결제 완료 화면이랑 안내 메일에 코드 나와요.</span></div>
    <div class="row"><span>폰이랑 노트북 둘 다 보고 싶어요</span><span>같은 코드 한 번 더 넣으면 돼요.</span></div>
    <div class="row"><span>코드가 안 먹어요</span><span>대소문자, 하이픈은 상관없어요. 그래도 안 되면 <span data-contact></span>로 결제 내역 캡처해서 보내 주세요. 바로 확인할게요.</span></div>
  </div>
</main>
<!--FOOT-->
<script type="module" src="/src/pages/unlock.ts"></script>
</body>
</html>
